name: Frontend CD

on:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pbi-lineage-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Frontend

    if: >-
      vars.DEPLOYMENT_ENABLED == 'true' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        )
      )

    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      ORAS_VERSION: "1.3.4"

    steps:
      - name: Resolve release SHA
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi

          if [ -z "$SHA" ]; then
            echo "Unable to resolve release SHA."
            exit 1
          fi

          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Release SHA: $SHA"

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            AZURE_RESOURCE_GROUP \
            AZURE_VM_NAME \
            ACR_NAME \
            ACR_REPOSITORY \
            PRODUCTION_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "$name is not configured."
              exit 1
            fi
          done

          echo "Deployment configuration is valid."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f build/client/index.html
          test -f build/client/web.config

          echo "Frontend artifact validation passed."

      - name: Create deployment ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_NAME="frontend-${RELEASE_SHA}.zip"

          cd build/client
          zip -r "../../${ARTIFACT_NAME}" .
          cd ../..

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" \
            >> "$GITHUB_ENV"

          ls -lh "${ARTIFACT_NAME}"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR login server
        shell: bash
        run: |
          set -euo pipefail

          LOGIN_SERVER="$(
            az acr show \
              --name "$ACR_NAME" \
              --query loginServer \
              --output tsv
          )"

          if [ -z "$LOGIN_SERVER" ]; then
            echo "Unable to resolve ACR login server."
            exit 1
          fi

          echo "ACR_LOGIN_SERVER=$LOGIN_SERVER" \
            >> "$GITHUB_ENV"

      - name: Install ORAS
        shell: bash
        run: |
          set -euo pipefail

          curl -sSL \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            -o oras.tar.gz

          mkdir oras-install

          tar -xzf oras.tar.gz \
            -C oras-install

          sudo mv oras-install/oras \
            /usr/local/bin/oras

          oras version

      - name: Authenticate ORAS to ACR
        shell: bash
        run: |
          set -euo pipefail

          ACR_TOKEN="$(
            az acr login \
              --name "$ACR_NAME" \
              --expose-token \
              --query accessToken \
              --output tsv
          )"

          printf '%s' "$ACR_TOKEN" |
            oras login \
              "$ACR_LOGIN_SERVER" \
              --username \
              "00000000-0000-0000-0000-000000000000" \
              --password-stdin

          unset ACR_TOKEN

      - name: Push frontend release to ACR
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_REF="${ACR_LOGIN_SERVER}/${ACR_REPOSITORY}:${RELEASE_SHA}"

          oras push \
            "$RELEASE_REF" \
            --artifact-type \
            "application/vnd.pbi-lineage.frontend.release.v1" \
            "${ARTIFACT_NAME}:application/zip" \
            ".azure/scripts/deploy-frontend.ps1:text/plain"

          echo "Frontend release pushed to ACR."

      - name: Deploy frontend to Azure VM
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_PATH=".azure/scripts/deploy-frontend-from-acr.ps1"

          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "Deployment script not found: $SCRIPT_PATH"
            exit 1
          fi

          SCRIPT_CONTENT="$(cat "$SCRIPT_PATH")"

          OUTPUT="$(
            az vm run-command invoke \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_VM_NAME" \
              --command-id RunPowerShellScript \
              --scripts "$SCRIPT_CONTENT" \
              --parameters \
                "AcrName=$ACR_NAME" \
                "Repository=$ACR_REPOSITORY" \
                "ReleaseId=$RELEASE_SHA" \
                "SiteName=PBI-Lineage" \
              --query "value[].message" \
              --output tsv
          )"

          RUN_COMMAND_EXIT_CODE=$?

          printf '%s\n' "$OUTPUT"

          if [ "$RUN_COMMAND_EXIT_CODE" -ne 0 ]; then
            echo "Azure VM Run Command failed."
            exit "$RUN_COMMAND_EXIT_CODE"
          fi

          if ! printf '%s' "$OUTPUT" |
            grep -q "DEPLOYMENT_RESULT=SUCCESS"
          then
            echo "Frontend deployment did not report success."
            exit 1
          fi

          echo "Frontend VM deployment completed successfully."

      - name: Verify frontend through IIS
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/frontend-smoke.ps1 <<'EOF'
          $ErrorActionPreference = "Stop"

          $headers = @{
              Host = "lvpowerbilineage.com"
          }

          Write-Output "Testing frontend through IIS..."

          $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1/" `
              -Headers $headers `
              -UseBasicParsing `
              -TimeoutSec 30

          if ($response.StatusCode -ne 200) {
              throw "Frontend returned HTTP $($response.StatusCode)."
          }

          if ($response.Content -notmatch "<html") {
              throw "Frontend response does not contain HTML."
          }

          Write-Output "Frontend IIS validation passed."
          Write-Output "FRONTEND_SMOKE_TEST=SUCCESS"
          EOF

          SCRIPT_CONTENT="$(cat /tmp/frontend-smoke.ps1)"

          MAX_ATTEMPTS=6
          WAIT_SECONDS=20

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Frontend verification attempt ${attempt}/${MAX_ATTEMPTS}"

            set +e

            OUTPUT="$(
              az vm run-command invoke \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_VM_NAME" \
                --command-id RunPowerShellScript \
                --scripts "$SCRIPT_CONTENT" \
                --query "value[].message" \
                --output tsv 2>&1
            )"

            EXIT_CODE=$?

            set -e

            printf '%s\n' "$OUTPUT"

            if [ "$EXIT_CODE" -eq 0 ]; then
              if printf '%s' "$OUTPUT" |
                grep -q "FRONTEND_SMOKE_TEST=SUCCESS"
              then
                echo "Frontend deployment validation passed."
                exit 0
              fi

              echo "Frontend verification did not report success."
              exit 1
            fi

            if printf '%s' "$OUTPUT" |
              grep -qi "Run command extension execution is in progress"
            then
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "Azure VM Run Command is busy."
                echo "Waiting ${WAIT_SECONDS}s..."
                sleep "$WAIT_SECONDS"
                continue
              fi
            fi

            echo "Frontend verification failed."
            exit "$EXIT_CODE"
          done

          echo "Frontend verification could not acquire Azure Run Command."
          exit 1

      - name: Deployment summary
        shell: bash
        run: |
          echo "Frontend deployment succeeded."
          echo "Release: $RELEASE_SHA"
          echo "Repository: $ACR_REPOSITORY"
          echo "Production URL: $PRODUCTION_URL"