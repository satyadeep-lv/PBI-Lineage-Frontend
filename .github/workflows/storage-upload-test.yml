name: Frontend Storage Upload Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-upload-test:
    name: Build and Upload Frontend Artifact
    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
      STORAGE_CONTAINER_NAME: ${{ vars.FRONTEND_CONTAINER_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Validate IIS artifact
        shell: bash
        run: |
          if [ ! -f build/client/index.html ]; then
            echo "build/client/index.html was not created."
            exit 1
          fi

          if [ ! -f build/client/web.config ]; then
            echo "build/client/web.config was not created."
            exit 1
          fi

          echo "Frontend artifact validation passed."

      - name: Prepare artifact
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ARTIFACT_NAME="build-test-${SHORT_SHA}.zip"

          cd build/client
          zip -r "../../${ARTIFACT_NAME}" .
          cd ../..

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

          echo "Artifact:"
          ls -lh "${ARTIFACT_NAME}"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload artifact to Blob Storage
        shell: bash
        run: |
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name "$STORAGE_CONTAINER_NAME" \
            --name "$ARTIFACT_NAME" \
            --file "$ARTIFACT_NAME" \
            --auth-mode login \
            --overwrite true

      - name: Verify artifact exists
        shell: bash
        run: |
          EXISTS=$(az storage blob exists \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name "$STORAGE_CONTAINER_NAME" \
            --name "$ARTIFACT_NAME" \
            --auth-mode login \
            --query exists \
            --output tsv)

          echo "Blob exists: $EXISTS"

          if [ "$EXISTS" != "true" ]; then
            echo "Uploaded blob could not be verified."
            exit 1
          fi

      - name: Show uploaded blob
        shell: bash
        run: |
          az storage blob show \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name "$STORAGE_CONTAINER_NAME" \
            --name "$ARTIFACT_NAME" \
            --auth-mode login \
            --query "{name:name,size:properties.contentLength}" \
            --output table

      - name: Test summary
        shell: bash
        run: |
          echo "Frontend build and storage upload test PASSED."
          echo "Artifact: $ARTIFACT_NAME"